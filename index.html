<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Builder - Master Working Version</title>
    <style>
        :root {
            --bg-dark: #070d11;
            --panel-bg: #0e1922;
            --panel-border: #1e3a4c;
            --accent-teal: #00e5ff;
            --accent-dim: #005f73;
            --text-main: #e0f2fe;
            --text-muted: #7dd3fc;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace, system-ui, -apple-system;
            user-select: none;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 10px;
        }

        .game-container {
            width: 100%;
            max-width: 520px;
            background: var(--panel-bg);
            border: 2px solid var(--panel-border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 229, 255, 0.1);
            overflow: hidden;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid var(--panel-border);
            font-size: 14px;
        }

        .round-indicator {
            color: var(--text-muted);
            font-weight: bold;
            letter-spacing: 1px;
        }

        .score-display {
            color: var(--accent-teal);
            font-weight: bold;
            font-size: 18px;
        }

        .dashboard {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 16px;
            background: #04080a;
            border-bottom: 1px solid var(--panel-border);
            font-size: 12px;
        }

        .heat-container {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-grow: 1;
            margin-right: 15px;
        }

        .heat-label {
            color: var(--warning);
            font-weight: bold;
        }

        .heat-bar-bg {
            flex-grow: 1;
            height: 10px;
            background: #1e293b;
            border: 1px solid var(--panel-border);
            border-radius: 4px;
            overflow: hidden;
        }

        .heat-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-teal);
            transition: width 0.3s ease, background 0.3s ease;
        }

        .controls-right {
            display: flex;
            gap: 6px;
        }

        .icon-btn {
            background: var(--panel-border);
            border: none;
            color: var(--text-main);
            width: 32px;
            height: 32px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: background 0.2s;
        }

        .icon-btn:hover {
            background: var(--accent-dim);
        }

        .play-area {
            display: grid;
            grid-template-columns: 130px 1fr;
            min-height: 400px;
            position: relative;
        }

        .sidebar {
            background: rgba(0,0,0,0.2);
            border-right: 1px solid var(--panel-border);
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 400px;
            overflow-y: auto;
        }

        .sidebar-title {
            font-size: 10px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .part-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 6px;
            text-align: center;
            cursor: grab;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .part-card:hover {
            border-color: var(--accent-teal);
            background: rgba(0, 229, 255, 0.05);
        }

        .part-card.selected-tap {
            border-color: var(--accent-teal);
            background: rgba(0, 229, 255, 0.15);
            box-shadow: 0 0 10px rgba(0, 229, 255, 0.3);
        }

        .part-icon {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .part-name {
            font-size: 9px;
            color: var(--text-main);
            font-weight: bold;
        }

        .workspace {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            position: relative;
            background: radial-gradient(circle at center, #0f2230 0%, #070d11 100%);
        }

        .motherboard {
            width: 100%;
            height: 100%;
            background: #0a1722;
            border: 2px dashed var(--panel-border);
            border-radius: 6px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(auto-fill, minmax(55px, 1fr));
            gap: 8px;
            padding: 10px;
            position: relative;
            overflow-y: auto;
            max-height: 380px;
        }

        .board-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.04);
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 4px;
            pointer-events: none;
        }

        .socket {
            background: rgba(0, 0, 0, 0.4);
            border: 2px dashed var(--panel-border);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px;
            transition: all 0.2s;
            position: relative;
            min-height: 55px;
        }

        .socket.highlight {
            border-color: var(--accent-teal);
            background: rgba(0, 229, 255, 0.08);
        }

        .socket.filled {
            border-style: solid;
            border-color: var(--success);
            background: rgba(34, 197, 94, 0.1);
        }

        .socket-title {
            font-size: 9px;
            color: var(--text-muted);
            margin-bottom: 2px;
            text-transform: uppercase;
        }

        .socket-content {
            font-size: 10px;
            font-weight: bold;
            color: var(--success);
            text-align: center;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 13, 17, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            z-index: 20;
            display: none;
        }

        .overlay.active {
            display: flex;
        }

        /* Setup and diagnostic activities can be taller than the game window. */
        #quizOverlay {
            justify-content: flex-start;
            overflow-y: auto;
            padding: 18px 12px;
        }
        #quizOverlay .quiz-choices { max-width: 410px; }
        .quiz-btn:disabled { opacity: .65; cursor: default; }
        .setup-info { color: var(--text-muted); font-size: 11px; line-height: 1.5;
            text-align: left; padding: 10px; border: 1px solid var(--panel-border);
            border-radius: 4px; width: 100%; }
        .setup-status { color: var(--warning); font-size: 11px; text-align: left; }
        .mission-panel { color: var(--text-muted); font-size: 11px; line-height: 1.5;
            padding: 7px; border: 1px solid var(--panel-border); border-radius: 5px; }
        .mission-panel button { width: 100%; margin-top: 8px; }

        .overlay h2 {
            font-size: 22px;
            margin-bottom: 12px;
            color: var(--accent-teal);
        }

        .overlay.overheat h2 {
            color: var(--danger);
            font-size: 26px;
            letter-spacing: 2px;
        }

        .overlay p {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 240px;
        }

        .btn {
            background: var(--accent-teal);
            color: var(--bg-dark);
            border: none;
            padding: 10px 24px;
            font-weight: bold;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            transition: opacity 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 100%;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: transparent;
            color: var(--accent-teal);
            border: 1px solid var(--accent-teal);
        }

        .btn-secondary:hover {
            background: rgba(0, 229, 255, 0.1);
        }

        .quiz-choices {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
            max-width: 340px;
            margin-bottom: 16px;
        }

        .quiz-btn {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            color: var(--text-main);
            padding: 10px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            text-align: left;
            transition: all 0.2s;
        }

        .quiz-btn:hover {
            border-color: var(--accent-teal);
            background: rgba(0, 229, 255, 0.1);
        }

        .guide-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-dark);
            z-index: 30;
            display: flex;
            flex-direction: column;
            padding: 16px;
            display: none;
        }

        .guide-modal.active {
            display: flex;
        }

        .guide-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 8px;
        }

        .guide-content {
            flex-grow: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-right: 4px;
        }

        .guide-item {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            padding: 8px;
        }

        .guide-section-title {
            color: var(--accent-teal);
            font-size: 13px;
            margin: 12px 0 4px;
            border-bottom: 1px solid var(--panel-border);
            padding-bottom: 6px;
        }

        .guide-item ul {
            padding-left: 17px;
            margin-top: 7px;
        }

        .guide-item li {
            color: var(--text-muted);
            font-size: 11px;
            line-height: 1.55;
            margin-bottom: 6px;
            user-select: text;
        }

        .guide-item p, .guide-item h4 { user-select: text; }

        .guide-item h4 {
            color: var(--accent-teal);
            font-size: 12px;
            margin-bottom: 2px;
        }

        .guide-item p {
            color: var(--text-muted);
            font-size: 10px;
            line-height: 1.3;
        }

        .footer-brand {
            padding: 6px;
            text-align: center;
            font-size: 10px;
            color: var(--panel-border);
            background: #04080a;
            border-top: 1px solid rgba(255,255,255,0.03);
        }

        svg.icon-svg {
            width: 20px;
            height: 20px;
            stroke: var(--accent-teal);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="top-bar">
            <span class="round-indicator" id="roundLabel">ROUND 1</span>
            <span class="score-display"><span id="scoreVal">0</span> PTS</span>
        </div>

        <div class="dashboard">
            <div class="heat-container">
                <span class="heat-label">HEAT</span>
                <div class="heat-bar-bg">
                    <div class="heat-bar-fill" id="heatFill"></div>
                </div>
            </div>
            <div class="controls-right">
                <button class="icon-btn" id="bgmToggleBtn" title="Toggle Arcade Music">🎵</button>
                <button class="icon-btn" id="soundToggleBtn" title="Toggle Sound Effects">🔊</button>
                <button class="icon-btn" id="guideBtn" title="Learning & Review Guide">📖</button>
                <button class="icon-btn" id="pauseBtn" title="Pause Game">⏸</button>
            </div>
        </div>

        <div class="play-area">
            <div class="sidebar" id="sidebar">
                <div class="sidebar-title">Parts Tray</div>
            </div>

            <div class="workspace">
                <div class="motherboard" id="motherboard">
                    <div class="board-label">BOARD</div>
                </div>
            </div>
        </div>

        <!-- Main Intro / State Overlay -->
        <div class="overlay active" id="mainOverlay">
            <h2 id="overlayTitle">PC BUILDER TRAINING</h2>
            <p id="overlayDesc">Install all 13 components across 3 progressive rounds, pass mini-quizzes, and conquer the final Master Quiz!</p>
            <div class="btn-group">
                <button class="btn" id="overlayBtn">PLAY NOW</button>
                <button class="btn btn-secondary" id="introGuideBtn">STUDY & REVIEW</button>
            </div>
        </div>

        <!-- Mini / Final Quiz Overlay -->
        <div class="overlay" id="quizOverlay">
            <h2 id="quizTitle">QUICK MINI-QUIZ (1.5x PTS)</h2>
            <p id="quizQuestion">Loading question...</p>
            <div class="quiz-choices" id="quizChoices"></div>
        </div>

        <!-- Part Guide Modal -->
        <div class="guide-modal" id="guideModal">
            <div class="guide-header">
                <h3>LEARNING & REVIEW GUIDE</h3>
                <button class="icon-btn" id="closeGuideBtn">✕</button>
            </div>
            <div class="guide-content" id="guideContentList"></div>
        </div>

        <div class="footer-brand">PC Builder Basics • 13-Part Campaign Edition</div>
    </div>

    <script>
        const HARDWARE_DB = [
            { id: 'board', name: 'Motherboard', category: 'board', desc: 'The manager: connects every part, holds the BIOS, and has Wi-Fi built in.' },
            { id: 'cpu', name: 'CPU', category: 'cpu', desc: 'The brain. It runs every instruction the computer carries out.' },
            { id: 'paste', name: 'Thermal Paste', category: 'paste', desc: 'Fills the tiny gaps between the CPU and cooler so heat can leave.' },
            { id: 'cooler', name: 'CPU Cooler', category: 'cooler', desc: 'Keeps the brain from overheating — fan cooled, or a radiator for liquid loops.' },
            { id: 'ram', name: 'RAM', category: 'ram', desc: 'How much the computer can hold in mind at once — like brain cells.' },
            { id: 'gpu', name: 'GPU', category: 'gpu', desc: 'Makes the pictures: the GUI you see after logging in, and every game frame.' },
            { id: 'ssd', name: 'SSD', category: 'storage', desc: 'Where everything is stored — pictures, games, applications.' },
            { id: 'hdd', name: 'Hard Drive', category: 'hdd', desc: 'An older spinning drive — slower than SSD, but cheap for bulk storage.' },
            { id: 'psu', name: 'PSU', category: 'psu', desc: 'The powerhouse — the mitochondria of the PC. It feeds energy to everything.' },
            { id: 'fan', name: 'Case Fan', category: 'fan', desc: 'Pushes the heat out of the chassis.' },
            { id: 'accessories', name: 'Accessories', category: 'accessories', desc: 'External peripherals such as a monitor, keyboard, and mouse connect to appropriate video and USB ports.' },
            { id: 'bios', name: 'BIOS', category: 'bios', desc: 'BIOS/UEFI is motherboard firmware used to initialize hardware and provide configuration settings before the operating system loads.' },
            { id: 'wifi', name: 'Wifi Chip', category: 'wifi', desc: 'Wireless connectivity can be provided by integrated motherboard hardware or an added WiFi adapter; verify the adapter and network configuration.' }
        ];

        // Mini quizzes between rounds
        const MINI_QUIZZES = [
            // Round 1 Mini-Quiz
            [
                { q: "Which component is the brain that runs every instruction the computer carries out?", choices: ["CPU", "PSU", "RAM", "BIOS"], correct: 0 },
                { q: "What fills the tiny gaps between the CPU and its cooler so heat can leave?", choices: ["Thermal Paste", "Liquid Coolant", "Silicon Oil", "Thermal Tape"], correct: 0 }
            ],
            // Round 2 Mini-Quiz
            [
                { q: "Which part is the powerhouse (mitochondria) of the PC that feeds energy to everything?", choices: ["PSU", "Motherboard", "Case Fan", "Hard Drive"], correct: 0 },
                { q: "Which drive is an older spinning drive — slower than an SSD, but cheap for bulk storage?", choices: ["Hard Drive", "NVMe SSD", "RAM", "GPU"], correct: 0 }
            ]
        ];

        // Ultimate Final Test covering all 13 parts (triggered at the end of Round 3)
        const ULTIMATE_FINAL_TEST = [
            {
                q: "Which main circuit board allows the processor, memory, and other components to communicate?",
                choices: ["Motherboard", "CPU", "GPU", "PSU"],
                correct: 0
            },
            {
                q: "Which component executes program instructions and performs calculations?",
                choices: ["CPU", "RAM", "Hard Drive", "Case Fan"],
                correct: 0
            },
            {
                q: "Which material improves heat transfer by filling microscopic gaps between a processor and its cooler?",
                choices: ["Thermal Paste", "Silicon Oil", "Liquid Coolant", "Thermal Tape"],
                correct: 0
            },
            {
                q: "Which component removes heat directly from the processor to help prevent thermal throttling?",
                choices: ["CPU Cooler", "Case Fan", "PSU", "SSD"],
                correct: 0
            },
            {
                q: "Which component temporarily holds data that running applications need to access quickly?",
                choices: ["RAM", "SSD", "Hard Drive", "BIOS"],
                correct: 0
            },
            {
                q: "Which component primarily processes graphics and renders images for display?",
                choices: ["GPU", "CPU", "Motherboard", "Accessories"],
                correct: 0
            },
            {
                q: "Which storage device uses flash memory and has no spinning platters?",
                choices: ["SSD", "Hard Drive", "RAM", "Wifi Chip"],
                correct: 0
            },
            {
                q: "Which storage device records data on rotating magnetic platters?",
                choices: ["Hard Drive", "NVMe SSD", "RAM", "GPU"],
                correct: 0
            },
            {
                q: "Which component converts incoming electrical power into usable power for PC hardware?",
                choices: ["PSU", "Motherboard", "Case Fan", "CPU"],
                correct: 0
            },
            {
                q: "Which component moves air through the computer case to improve airflow?",
                choices: ["Case Fan", "CPU Cooler", "Thermal Paste", "Wifi Chip"],
                correct: 0
            },
            {
                q: "What category includes devices such as keyboards, monitors, and mice?",
                choices: ["Accessories", "BIOS", "Motherboard", "RAM"],
                correct: 0
            },
            {
                q: "Where can a technician check whether the firmware detects installed memory and storage before the operating system loads?",
                choices: ["BIOS", "GPU", "SSD", "CPU"],
                correct: 0
            },
            {
                q: "Which hardware enables a computer to connect to a wireless local area network?",
                choices: ["Wifi Chip", "Case Fan", "Hard Drive", "PSU"],
                correct: 0
            }
        ];

        const SVG_ICONS = {
            cpu: '<svg class="icon-svg" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6v6H9z"/></svg>',
            cooler: '<svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v4M12 16v4"/></svg>',
            gpu: '<svg class="icon-svg" viewBox="0 0 24 24"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="8" cy="12" r="3"/></svg>',
            ram: '<svg class="icon-svg" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="10" rx="1"/><path d="M6 7v10M10 7v10"/></svg>',
            psu: '<svg class="icon-svg" viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M6 12h12"/></svg>',
            fan: '<svg class="icon-svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9"/></svg>',
            storage: '<svg class="icon-svg" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 8h10M7 12h10"/></svg>',
            board: '<svg class="icon-svg" viewBox="0 0 24 24"><rect x="2" y="2" width="20" height="20" rx="2"/><path d="M6 6h2v2H6zM14 6h4v4h-4z"/></svg>',
            accessories: '<svg class="icon-svg" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>',
            paste: '<svg class="icon-svg" viewBox="0 0 24 24"><path d="M18 2l4 4M7.5 20.5 19 9l-4-4L3.5 16.5 2 22z"/></svg>',
            bios: '<svg class="icon-svg" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M9 9h6M9 12h6M9 15h4"/></svg>',
            wifi: '<svg class="icon-svg" viewBox="0 0 24 24"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>',
            hdd: '<svg class="icon-svg" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="12" cy="11" r="4"/><circle cx="12" cy="11" r="1"/></svg>'
        };

        let gameState = {
            round: 1,
            score: 0,
            heat: 0,
            maxHeat: 100,
            heatRate: 0.35,
            isPlaying: false,
            isPaused: false,
            soundEnabled: true,
            bgmEnabled: false,
            requiredParts: [],
            placedParts: new Set(),
            selectedPartId: null,
            timerInterval: null,
            bgmInterval: null,
            miniQuizIndex: 0,
            finalTestIndex: 0,
            examQuestions: []
        };

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!gameState.soundEnabled) return;
            initAudio();
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'snap') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(600, now + 0.1);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now); osc.stop(now + 0.1);
            } else if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
                osc.start(now); osc.stop(now + 0.05);
            } else if (type === 'success') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.setValueAtTime(659.25, now + 0.1);
                osc.frequency.setValueAtTime(783.99, now + 0.2);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.35);

function handlePartPlacement(draggedId, targetSocketId) {
    
// ROUND 3: PREVENT FIRMWARE INSTALLATION
    // BIOS/UEFI firmware is stored on the motherboard.
    // It is not installed like RAM or a graphics card.
    // Players will complete a firmware verification activity instead.

    if (gameState.round === 3 || campaignStage.startsWith('level2')) {
        return;
    }

// Original Hardware Installation
// Only allow placement while the game is active
            if (!gameState.isPlaying || gameState.isPaused) return;

// Check whether the selected component matches its socket.
            if (draggedId === targetSocketId && !gameState.placedParts.has(draggedId)) {
                gameState.placedParts.add(draggedId);
                playSound('snap');
                gameState.score += 100;
                scoreVal.textContent = gameState.score;
                gameState.heat = Math.max(0, gameState.heat - 14);
                renderSidebar(); renderMotherboard();
                if (gameState.placedParts.size === gameState.requiredParts.length) completeRound();
            } else {
                playSound('click');
            }
        }

        function completeRound() {
            gameState.isPlaying = false;
            clearInterval(gameState.timerInterval);
            if (gameState.bgmInterval) { clearInterval(gameState.bgmInterval); gameState.bgmInterval = null; }
            playSound('success');

            if (gameState.round === 1 || gameState.round === 2) {
                triggerMiniQuiz();
            } else {
                // ROUND 3: Start the original 13-question final assessment.
                gameState.finalTestIndex = 0;
                // Create a fresh randomized exam for each playthrough.
                // Keep the original question bank unchanged for future games.
                gameState.examQuestions = shuffleItems(ULTIMATE_FINAL_TEST.map((question, originalIndex) => ({
                    ...question,
                    topicId: HARDWARE_DB[originalIndex].id
                })));
                triggerFinalTestStep();
            }
        }

        // ASSESSMENT REVIEW: When an answer is incorrect, explain why and
        // offer a direct link to the relevant topic in the Learning & Review Guide.
        // The player can review without losing their place in the assessment.
        function showIncorrectAnswerReview(quiz, topicId, continueAssessment) {
            playSound('click');
            quizQuestion.textContent =
                'Not quite. Correct answer: ' + quiz.choices[quiz.correct] +
                '. Review the topic below, then continue.';
            quizChoices.innerHTML = '';

            const reviewButton = document.createElement('button');
            reviewButton.className = 'quiz-btn';
            reviewButton.textContent = '📖 REVIEW THIS TOPIC';
            reviewButton.addEventListener('click', () => {
                // The guide sits above the quiz, so closing it returns here.
                populateGuide();
                guideModal.classList.add('active');
                const topic = document.querySelector('[data-review-topic="' + topicId + '"]');
                if (topic) topic.scrollIntoView({ block: 'start' });
            });

            const continueButton = document.createElement('button');
            continueButton.className = 'btn';
            continueButton.textContent = 'CONTINUE ASSESSMENT';
            continueButton.addEventListener('click', continueAssessment);

        function triggerMiniQuiz() {
            quizOverlay.classList.add('active');
            quizTitle.textContent = `ROUND ${gameState.round} MINI-QUIZ (1.5x PTS)`;
            const quizSet = MINI_QUIZZES[gameState.round - 1];
            const quiz = quizSet[Math.floor(Math.random() * quizSet.length)];
            quizQuestion.textContent = quiz.q;
            quizChoices.innerHTML = '';
            quiz.choices.forEach((choice, index) => {
                const btn = document.createElement('button');
                btn.className = 'quiz-btn';
                btn.textContent = choice;
                btn.addEventListener('click', () => {
                    // Continue only once, after the answer or review is complete.
                    const finishMiniQuiz = () => {
                        quizOverlay.classList.remove('active');
                        showRoundCompleteModal();
                    };
                    if (index === quiz.correct) {
                        playSound('success');
                        gameState.score += 200;
                        scoreVal.textContent = gameState.score;
                        finishMiniQuiz();
                    } else {
                        // Match the correct answer to the hardware guide entry.
                        const correctName = quiz.choices[quiz.correct];
                        const topic = HARDWARE_DB.find(part =>
                            part.name.toLowerCase() === correctName.toLowerCase()
                        );
                        showIncorrectAnswerReview(quiz, topic ? topic.id : 'board', finishMiniQuiz);
                    }
                });
                quizChoices.appendChild(btn);
            });
        }

        // RANDOMIZATION: Fisher-Yates shuffle makes a new independent copy.
        // This changes the order without changing the original answer key.
        function shuffleItems(items) {
            const shuffled = [...items];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        // FINAL EXAM: Shuffle both question order and answer placement.
        // Each answer retains its correct/incorrect flag after shuffling.
        function triggerFinalTestStep() {
            quizOverlay.classList.add('active');

            })));

                        if (gameState.finalTestIndex < gameState.examQuestions.length) {

                    };
                    if (answer.correct) {
                        playSound('success');
                        gameState.score += 150;
                        scoreVal.textContent = gameState.score;
                        advanceExam();
                    } else {
                        // topicId travels with the question, even after shuffling.
                        showIncorrectAnswerReview(quiz, quiz.topicId, advanceExam);
                    }
                });
                quizChoices.appendChild(btn);
            });
        }

function beginInvestigation() {
    campaignStage = 'level2Investigating';
    // Reset evidence whenever this mission starts.
    missionInspected.clear();
    mainOverlay.classList.remove('active', 'overheat');
    quizOverlay.classList.remove('active');
    gameState.isPlaying = false; // No heat countdown during diagnostics.
    roundLabel.textContent = 'LEVEL 2 / INVESTIGATE';
    renderMotherboard();
    renderMissionSidebar();

// LEARNING & REVIEW GUIDE
// Keep reference material in one place so players can review before
// starting a task or revisit a concept after answering incorrectly.
const ROUND3_REVIEW = [
    {
        title: 'Accessories: Connecting peripherals',
        points: [
            'A peripheral is a device connected to the computer, such as a monitor, keyboard, mouse, or speakers.',
            'A monitor uses a compatible video output such as HDMI or DisplayPort. In this game, the dedicated graphics card provides the active display output, so connect the monitor to the GPU.',
            'A standard wired USB keyboard and USB mouse connect to available compatible USB ports. They do not connect to RAM slots, SATA connectors, or CPU fan headers.',
            'Check both the connector type and the device purpose. Some computers also support wireless keyboards and mice.'
        ]
    },
    {
        title: 'BIOS/UEFI: Firmware verification',
        points: [
            'BIOS and UEFI are firmware interfaces used during startup. UEFI is the modern replacement for traditional BIOS on most newer computers.',
            'Firmware is stored in nonvolatile memory on the motherboard. It is not a separate part you drag into a socket during assembly.',
            'Before the operating system loads, firmware initializes hardware and can show detected processor, installed memory, and storage devices.',
            'In our simulated setup, check the CPU (Intel Core i5), memory (16 GB RAM), SSD (512 GB), and HDD (1 TB). These specifications are fictional training examples.',
            'Verifying detection means confirming the system recognizes the devices; it does not prove every component is healthy or that the operating system is configured correctly.'
        ]
    },
    {
        title: 'WiFi: Adapter and network security',
        points: [
            'Wireless networking may be built into the motherboard or supplied by an additional PCIe or USB adapter. This game assumes the motherboard already has integrated WiFi.',
            'If integrated WiFi is functional, a second wireless card is not required. A real system may also need antennas, drivers, or an enabled adapter.',
            'After the operating system starts, check its network or device settings to confirm the wireless adapter is recognized and enabled.',
            'Connect only to a trusted network. Prefer WPA3-Personal when available, or WPA2 with AES encryption as a fallback.',
            'An open or similarly named network may be unsafe. Encryption protects the wireless connection, but you should still verify you selected the intended network.'
        ]
    }
];

function populateGuide() {
    const list = document.getElementById('guideContentList');
    list.innerHTML = '';

    // Build text using textContent instead of HTML interpolation.
    // This keeps the guide easy to extend and avoids accidental markup.
    function addSection(title) {
        const heading = document.createElement('h4');
        heading.className = 'guide-section-title';
        heading.textContent = title;
        list.appendChild(heading);
    }

    addSection('LEVEL 1 · HARDWARE REFERENCE (13 TOPICS)');
    HARDWARE_DB.forEach(part => {
        const item = document.createElement('div');
        item.className = 'guide-item';
        const name = document.createElement('h4');
        name.textContent = part.name;
        const description = document.createElement('p');
        description.textContent = part.desc;
        item.dataset.reviewTopic = part.id;
        item.append(name, description);
        list.appendChild(item);
    });

    addSection('ROUND 3 · SYSTEM SETUP REVIEW');
    ROUND3_REVIEW.forEach(topic => {
        const item = document.createElement('div');
        item.className = 'guide-item';
        const name = document.createElement('h4');
        name.textContent = topic.title;
        const bullets = document.createElement('ul');
        topic.points.forEach(point => {
            const li = document.createElement('li');
            li.textContent = point;
            bullets.appendChild(li);
        });
        item.append(name, bullets);
        list.appendChild(item);
    });

    addSection('LEVEL 2 · TROUBLESHOOTING PREVIEW');
    const mission = document.createElement('div');
    mission.className = 'guide-item';
    const missionTitle = document.createElement('h4');
    missionTitle.textContent = 'Investigate before replacing parts';
    const missionText = document.createElement('p');
    missionText.textContent = 'A high CPU temperature with unexpected shutdowns suggests a cooling problem, but temperature alone does not identify the cause. Inspect evidence, power down and disconnect the computer before checking internal fan connections, and verify normal operation after a repair.';
    mission.append(missionTitle, missionText);
    list.appendChild(mission);
}

                overlayBtn.addEventListener('click', () => {
            if (campaignStage === 'level2Mission1Complete') {
                campaignStage = 'level1';
                gameState.round = 1;
                gameState.score = 0;
                gameState.finalTestIndex = 0;
                scoreVal.textContent = '0';
                startRound();
                return;
            }
            if (campaignStage === 'level1Complete') {
                startLevel2();
                return;
            }

            if (campaignStage === 'level2') {
    		startMission1();
    		return;
	}
	    if (campaignStage === 'level2Mission1') {
    		beginInvestigation();
    		return;
	}

            if (gameState.isPaused) {
                gameState.isPaused = false;
                document.getElementById('pauseBtn').textContent = '⏸';
                mainOverlay.classList.remove('active');
                return;
            }

            startRound();
        });
        introGuideBtn.addEventListener('click', () => { playSound('click'); populateGuide(); guideModal.classList.add('active'); });
        
        document.getElementById('soundToggleBtn').addEventListener('click', () => {
            gameState.soundEnabled = !gameState.soundEnabled;
            document.getElementById('soundToggleBtn').textContent = gameState.soundEnabled ? '🔊' : '🔇';
            playSound('click');
        });
        document.getElementById('bgmToggleBtn').addEventListener('click', toggleBGM);
        document.getElementById('guideBtn').addEventListener('click', () => { playSound('click'); populateGuide(); guideModal.classList.add('active'); });
        document.getElementById('closeGuideBtn').addEventListener('click', () => { playSound('click'); guideModal.classList.remove('active'); });
        document.getElementById('pauseBtn').addEventListener('click', () => {
            if (!gameState.isPlaying) return;
            gameState.isPaused = !gameState.isPaused;
            document.getElementById('pauseBtn').textContent = gameState.isPaused ? '▶' : '⏸';
            if (gameState.isPaused) {
                mainOverlay.classList.add('active');
                overlayTitle.textContent = "GAME PAUSED"; overlayDesc.textContent = "Take a break."; overlayBtn.textContent = "RESUME";
                introGuideBtn.style.display = "none";
            } else { mainOverlay.classList.remove('active'); }
            playSound('click');
        });
		

    // ROUND 3: ACCESSORIES AND WIFI SETUP
    // One activity at a time. Players must select the appropriate action
    // for each step; incorrect choices explain the problem without scoring.
    const SETUP_ACTIVITIES = {
        accessories: {
            title: 'CONNECT EXTERNAL PERIPHERALS',
            intro: 'The computer is assembled. Choose the appropriate connection for each peripheral. In this scenario, the dedicated graphics card is the active video output.',
            steps: [
                { prompt: 'Where should you connect the monitor video cable?',
                  choices: ['To a video output on the graphics card (HDMI/DisplayPort)', 'To a USB-A data port', 'To the power supply AC inlet'], correct: 0,
                  why: 'A monitor receives video from a compatible display output. With a dedicated GPU in use, connect to its video port.' },
                { prompt: 'Which connection is appropriate for a standard wired USB keyboard?',
                  choices: ['A SATA data connector', 'An available USB port', 'The CPU fan header'], correct: 1,
                  why: 'A wired USB keyboard connects to a compatible USB port.' },
                { prompt: 'Where should a standard wired USB mouse connect?',
                  choices: ['An available USB port', 'A PCIe power connector', 'The motherboard RAM slot'], correct: 0,
                  why: 'A wired USB mouse connects to a compatible USB port.' }
            ]
        },
        wifi: {
            title: 'VERIFY WIRELESS CONNECTIVITY',
            intro: 'This simulated motherboard includes integrated WiFi. You do not need to install a second wireless chip. Verify the adapter and choose a secure connection.',
            steps: [
                { prompt: 'The motherboard already has working integrated WiFi. What additional WiFi hardware must you install?',
                  choices: ['A second WiFi card is always required', 'None, provided the integrated adapter is functional', 'A second CPU'], correct: 1,
                  why: 'Integrated WiFi can provide wireless networking without an additional expansion card.' },
                { prompt: 'Where can you confirm the wireless adapter is recognized after the operating system starts?',
                  choices: ['Only in the power supply', 'Only by looking at the case fan', 'In the operating system network adapter/device settings'], correct: 2,
                  why: 'Operating system device and network settings can show whether the wireless adapter is recognized and enabled.' },
                { prompt: 'Which wireless network configuration is the best option here?',
                  choices: ['Join the trusted network using WPA3-Personal, or WPA2-AES when WPA3 is unavailable', 'Disable encryption for better speed', 'Connect to any similarly named open network'], correct: 0,
                  why: 'Use a trusted network and strong wireless encryption. WPA3 is preferred when supported; WPA2-AES is an acceptable fallback.' }
            ]
        }
    };

    // Shared helper awards exactly 100 points after an activity is finished.
    function finishRound3Activity(partId) {
        if (gameState.round !== 3 || !gameState.isPlaying || gameState.placedParts.has(partId)) return;
        gameState.placedParts.add(partId);
        gameState.score += 100;
        scoreVal.textContent = gameState.score;
        playSound('success');
        quizOverlay.classList.remove('active');
        renderSidebar();
        renderMotherboard();
        if (gameState.placedParts.size === gameState.requiredParts.length) completeRound();
    }

    function openSetupActivity(partId) {
        const activity = SETUP_ACTIVITIES[partId];
        if (!activity || gameState.placedParts.has(partId)) return;
        let stepIndex = 0;
        quizOverlay.classList.add('active');
        function showStep() {
            const step = activity.steps[stepIndex];
            quizTitle.textContent = activity.title + ` (${stepIndex + 1}/${activity.steps.length})`;
            quizQuestion.textContent = step.prompt;
            quizChoices.innerHTML = '';
            if (stepIndex === 0) {
                const intro = document.createElement('div');
                intro.className = 'setup-info';
                intro.textContent = activity.intro;
                quizChoices.appendChild(intro);
            }
            const feedback = document.createElement('p');
            feedback.className = 'setup-status';
            step.choices.forEach((choice, index) => {
                const btn = document.createElement('button');
                btn.className = 'quiz-btn';
                btn.textContent = choice;
                btn.addEventListener('click', () => {
                    if (index !== step.correct) {
                        playSound('click');
                        feedback.textContent = 'Not quite. Consider the purpose of the connection and try again.';
                        return;
                    }
                    playSound('success');
                    quizChoices.innerHTML = '';
                    quizQuestion.textContent = step.why;
                    const next = document.createElement('button');
                    next.className = 'btn';
                    next.textContent = stepIndex === activity.steps.length - 1 ? 'FINISH SETUP (+100 PTS)' : 'NEXT CHECK';
                    next.addEventListener('click', () => {
                        stepIndex++;
                        if (stepIndex === activity.steps.length) finishRound3Activity(partId);
                        else showStep();
                    });
                    quizChoices.appendChild(next);
                });
                quizChoices.appendChild(btn);
            });
            quizChoices.appendChild(feedback);
        }
        showStep();
    }

    // ROUND 3: SIMULATED UEFI FIRMWARE INTERFACE
    // This function opens a simulated firmware setup screen.
    // It does not access or modify the player's real BIOS/UEFI.
    function openUEFI() {

        // Hide the regular game screen behind the quiz overlay.
        quizOverlay.classList.add('active');

        // Give the simulated firmware screen its own heading.
        quizTitle.textContent = "UEFI FIRMWARE SETUP";

        // Explain what the player needs to verify.
        quizQuestion.textContent =
            "Inspect the system information and verify that " +
            "the CPU, memory, and storage devices are detected.";

        // Clear any buttons left over from previous quizzes.
        quizChoices.innerHTML = '';

        // Define the simulated hardware information.
        // These values are fictional training data.
        const systemInfo = [
            "CPU: Intel Core i5 (Detected)",
            "Memory: 16 GB RAM (Detected)",
            "Storage: 512 GB SSD (Detected)",
            "Storage: 1 TB HDD (Detected)"
        ];

        // Create a separate display entry for each device.
        systemInfo.forEach(info => {

            const entry = document.createElement('div');

            // Use existing styling to match the game.
            entry.className = 'quiz-btn';

            // Display the simulated hardware information.
            entry.textContent = info;

            // Add the entry to the UEFI interface.
            quizChoices.appendChild(entry);
        });
		
    // TRACK THE PLAYER'S VERIFICATION
    // The player must inspect each hardware category.
    const verified = new Set();

    // Create a button for each verification task.
    const checks = [
        { id: 'cpu', label: 'VERIFY CPU DETECTION' },
        { id: 'ram', label: 'VERIFY MEMORY DETECTION' },
        { id: 'storage', label: 'VERIFY STORAGE DETECTION' }
    ];

    checks.forEach(check => {
        const button = document.createElement('button');
        button.className = 'quiz-btn';
        button.textContent = check.label;

        button.addEventListener('click', () => {

            // Record this verification only once.
            verified.add(check.id);
            button.textContent = '✓ ' + check.label;
            button.disabled = true;

            // Unlock completion after all three checks.
            if (verified.size === checks.length) {
                finishButton.disabled = false;
                finishButton.textContent = 'EXIT UEFI & COMPLETE VERIFICATION';
            }
        });

        quizChoices.appendChild(button);
    });

    // COMPLETION BUTTON
    // Keep this locked until all checks are verified.
    const finishButton = document.createElement('button');
    finishButton.className = 'btn';
    finishButton.textContent = 'COMPLETE ALL CHECKS FIRST';
    finishButton.disabled = true;

    finishButton.addEventListener('click', () => {

        // Use the same single-award completion path as the other Round 3 tasks.
        finishRound3Activity('bios');
    });

    quizChoices.appendChild(finishButton);

    }

    </script>
